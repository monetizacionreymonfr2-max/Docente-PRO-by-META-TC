name: Camila - opciones Skills y PDF
on:
  push:
    branches:
      - opt-claude-skills-libreoffice-20261030
  workflow_dispatch:
jobs:
  api_y_frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: node --test tests/camila-opcionales.test.mjs
      - run: npm run test:claude
      - run: npm run build
  libreoffice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Instalar LibreOffice y python-docx para prueba independiente
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-writer fonts-dejavu-core >/dev/null
          python -m pip install --quiet python-docx
      - run: python -m unittest discover -s tests -p 'test_libreoffice_worker.py' -v
