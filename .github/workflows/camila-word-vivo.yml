name: Camila Plus Word vivo - validacion
on:
  push:
    branches:
      - feat/camila-plus-word-vivo-20261116
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b163ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test:camila-gemini-formato
      - run: npm run test:mi-formato
      - run: npm run test:ppa-completo
      - run: npm run test:ppa-libro
      - run: npm run test:camila-privacidad
      - run: npm run build
