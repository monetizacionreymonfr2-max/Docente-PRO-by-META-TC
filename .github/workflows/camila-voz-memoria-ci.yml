name: Validar Camila voz y memoria
on:
  push:
    branches:
      - feat/llamadas-camila-gemini-20261107
      - feat/camila-memoria-documentos-20261110
  workflow_dispatch:
permissions:
  contents: read
jobs:
  camila:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build
      - run: npm run test:camila-voz
      - run: npm run test:camila-privacidad
      - run: npm run test:gemini
